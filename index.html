<style>

body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7;

header{background:var(--green);color:var(--cream);padding:34px 0 28px;text-align:center}

header a.ig{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.1em;color:var(--gold);

 padding:12px 0 10px;margin-bottom:18px}
.panel .wrap{padding-bottom:0}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;padding:12px 38px 12px 40px;font-size:16px;border:1px solid var(--line);

.search input:focus{outline:2px solid var(--gold);outline-offset:-2px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;

.views{display:flex;border:1px solid var(--line);background:var(--card);flex-shrink:0}
.views button{border:0;background:none;color:var(--ink3);padding:11px 12px;cursor:pointer;font-size:15px;font-family:inherit}
.views button[aria-pressed="true"]{background:var(--green);color:var(--cream)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--chip);color:var(--ink2);
 padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--green);color:var(--cream);border-color:var(--green)}
.grouplabel{font-size:10px;letter-spacing:.16em;color:var(--ink3);padding:8px 0 0;flex-shrink:0;align-self:center;margin-right:2px}
.count{font-size:12px;color:var(--ink3);padding:8px 0 0;font-variant-numeric:tabular-nums}

.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
 padding:12px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:18px}

/* 表示: カード */
#list.card .it{background:var(--card);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
#list.card .it img{display:block;width:100%;height:auto}
#list.card .body{padding:14px 16px 16px}
/* 表示: 一覧（コンパクト） */
#list.compact{border-top:1px solid var(--line)}
#list.compact .it{border-bottom:1px solid var(--line);padding:13px 4px;display:flex;gap:12px;align-items:flex-start}
#list.compact .it img{width:74px;height:74px;object-fit:cover;flex-shrink:0}
#list.compact .body{flex:1;min-width:0;padding:0}
#list.compact h2{font-size:15.5px}
#list.compact .hk{display:none}
#list.compact a.btn{padding:9px 12px;font-size:13px;margin-top:8px}
/* 表示: 3列タイル。写真が無い宿は宿名だけのタイルにする */
#list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){#list.grid{grid-template-columns:repeat(4,1fr);gap:12px}}
@media(min-width:860px){#list.grid{grid-template-columns:repeat(5,1fr)}}
#list.grid .it{background:var(--card);border:1px solid var(--line);overflow:hidden;
 display:block;text-decoration:none;color:inherit;position:relative}
#list.grid .it:hover,#list.grid .it:focus-visible{border-color:var(--gold)}

#list.grid .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 padding:8px;text-align:center;background:linear-gradient(160deg,#2b4b39,#1b3226)}
#list.grid .ph span{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:14px;

footer{border-top:1px solid var(--line);padding-top:20px;margin-top:30px;font-size:11.5px;color:var(--ink3);text-align:center}
footer a{color:var(--ink3)}

const list = document.getElementById('list');
const qEl = document.getElementById('q');
const clr = document.getElementById('clr');
const countEl = document.getElementById('count');
const filters = { th: null, r: null, s: null };
let view = 'card';

const norm = s => (s||'').toLowerCase().replace(/[\s　]/g,'');

function match(it){
  for (const k of ['th','r','s']) {
    const f = filters[k]; if (!f) continue;
    if (k === 'th') { if (!it.th.includes(f)) return false; }
    else if (it[k] !== f) return false;
  }
  const q = norm(qEl.value);
  if (!q) return true;
  const hay = norm([it.n, it.o, it.p, it.r, it.hk, it.d, it.s, it.pj.join(' '), it.th.join(' ')].join(' '));
  return q.split('+').every(t => t && hay.includes(t));
}

function tile(it){
  // 写真が無い宿はタイル内に宿名を出す。その場合、下の見出しは重複するので出さない
  const src = it.img ? 'img/'+it.img : it.rimg;
  // 楽天側の画像が消えていたら、宿名のタイルに戻す
  const inner = src
    ? '<img src="'+src+'" alt="" loading="lazy" data-n="'+it.n+'">'
    : '<div class="ph"><span>'+it.n+'</span></div>';
  const pin = it.s ? '<span class="pin">'+it.s+'</span>' : '';
  const body = '<div class="body"><h2 class="mincho">'+it.n+'</h2>'
    + (it.p ? '<p class="sub">'+it.p+'</p>' : '') + '</div>';
  const inside = '<div class="thumb">'+inner+pin+'</div>'+body;
  return it.url
    ? '<a class="it" href="'+it.url+'" rel="nofollow sponsored noopener">'+inside+'</a>'
    : '<div class="it off">'+inside+'</div>';
}

function card(it){
  // カード表示は自前の写真だけ（大きく出すので選定を通したものに限る）。
  // 一覧表示は小さいので楽天の写真も使う
  const thumb = it.img ? 'img/'+it.img : (view === 'compact' ? it.rimg : '');
  const img = thumb ? '<img src="'+thumb+'" alt="" loading="lazy">' : '';
  const badges = [
    it.s ? '<span class="badge">'+it.s+'</span>' : '',
    ...it.th.slice(0,2).map(t => '<span class="badge t">'+t+'</span>'),
    it.d ? '<span class="date">'+it.d+'</span>' : ''
  ].join('');
  const btn = it.url
    ? '<a class="btn" href="'+it.url+'" rel="nofollow sponsored noopener"><span>空室と料金を見る</span><span class="ar">→</span></a>'
    : '<div class="nolink">楽天トラベルに掲載がありません</div>';
  return '<article class="it">'+img+'<div class="body">'
    + '<div class="meta">'+badges+'</div>'
    + '<h2 class="mincho">'+it.n+'</h2>'
    + (it.p ? '<p class="sub">'+it.p+(it.rv?' ・ 楽天評価 '+it.rv:'')+'</p>' : '')
    + (it.hk ? '<p class="hk">'+it.hk+'</p>' : '')
    + '<p class="pj">'+it.pj[it.pj.length-1]+'</p>'
    + btn + '</div></article>';
}

function render(){
  const hits = DATA.filter(match);
  list.className = view;
  const draw = view === 'grid' ? tile : card;
  list.innerHTML = hits.length
    ? hits.map(draw).join('')
    : '<p class="empty">見つかりませんでした。<br>宿名の一部や県名でも探せます。</p>';
  countEl.textContent = hits.length + ' 軒' + (hits.length !== DATA.length ? '（全' + DATA.length + '軒中）' : '');
  clr.style.display = qEl.value ? 'block' : 'none';
}

// 楽天側の写真が消えている宿は、宿名だけのタイルに戻す。
// img の error はバブリングしないので、キャプチャで拾う
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.closest('.thumb')) return;
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.innerHTML = '<span></span>';
  ph.firstChild.textContent = img.dataset.n || '';
  img.replaceWith(ph);
}, true);

qEl.addEventListener('input', render);
clr.addEventListener('click', () => { qEl.value=''; qEl.focus(); render(); });
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k, v = b.dataset.v;
  const on = filters[k] === v;
  filters[k] = on ? null : v;
  document.querySelectorAll('.chip[data-k="'+k+'"]').forEach(c =>
    c.setAttribute('aria-pressed', String(!on && c.dataset.v === v)));
  render();
});
document.querySelector('.views').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.view;
  document.querySelectorAll('.views button').forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  try { localStorage.setItem('oyutabi_view', view); } catch {}
  render();
});
try {
  const v = localStorage.getItem('oyutabi_view');
  if (v) { view = v; document.querySelectorAll('.views button').forEach(x =>
    x.setAttribute('aria-pressed', String(x.dataset.view === v))); }
} catch {}
render();
</script>
